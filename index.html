<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flyer Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme=localStorage.flyerTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
</head>
<body>
<div class="wrap">
<button id="theme" aria-label="Toggle theme">&#127769;</button>
<h1>🚀 Flyer Flashcards</h1>
<button id="topicBtn" class="topic-btn" aria-haspopup="dialog">
 <span class="tb-label">📚 <b id="tbName"></b></span>
 <span class="tb-meta"><span id="tbCount"></span> ▾</span>
</button>
<div class="bar"><div id="bar"></div></div>
<div class="row modes">
 <button id="mFlash" class="on">🃏 Thẻ</button>
 <button id="mQuiz">🎯 Trắc nghiệm</button>
 <button id="shuf" aria-label="Trộn thẻ">🔀</button>
</div>
<div id="main"></div>
</div>

<div id="sheet" class="sheet" hidden>
 <div class="sheet-backdrop" id="sheetBg"></div>
 <div class="sheet-panel" role="dialog" aria-label="Chọn chủ đề">
  <div class="sheet-head"><b>Chọn chủ đề</b><button id="sheetClose" aria-label="Đóng">✕</button></div>
  <div id="sheetBody" class="sheet-body"></div>
 </div>
</div>
<script src="js/data.js"></script>
<script src="js/data-flyers.js"></script>
<script src="js/emoji.js"></script>
<script src="js/app.js"></script>
</body>
</html>
